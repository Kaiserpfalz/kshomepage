<div class="flex-1 h-full w-full rounded-lg flex relative">
    <div class="absolute inset-0 z-0 flex items-center justify-center gap-8 p-8 z-100" id="consent_{{ .Page.File.UniqueID }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" class="text-rose-600 hidden sm:block">
            <path fill="currentColor"
                d="M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12q0-1.875.725-3.675T4.75 5.112t3.125-2.275t4-.862q.525 0 1.075.05t1.125.175q-.225 1.125.15 2.125t1.125 1.662t1.788.913t2.137-.125q-.65 1.475.188 2.825T21.95 11q.025.275.038.512t.012.513q0 2.05-.788 3.862t-2.137 3.175t-3.175 2.15T12 22m-1.5-12q.625 0 1.063-.437T12 8.5t-.437-1.062T10.5 7t-1.062.438T9 8.5t.438 1.063T10.5 10m-2 5q.625 0 1.063-.437T10 13.5t-.437-1.062T8.5 12t-1.062.438T7 13.5t.438 1.063T8.5 15m6.5 1q.425 0 .713-.288T16 15t-.288-.712T15 14t-.712.288T14 15t.288.713T15 16" />
        </svg>
        <div class="max-w-sm">
            <p class="mb-4">Dieser Google-Maps Embed benötigt ihre Cookie-Zustimmung um einen Externen Dienst zu laden.</p>
            <button class="cursor-pointer px-2 py-1 shadow rounded" onclick="COOKIE_CONSENT_ACCEPT_ALL()">Zustimmen</button>
        </div>
    </div>
    <iframe id="loc_{{ .Page.File.UniqueID }}"
        class="z-20 w-full h-full"
        data-target="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5045.955020816814!2d6.063282277159332!3d50.77599047165613!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c0998152a01a99%3A0xa537517e8db17c80!2sHexenberg%2010%2C%2052074%20Aachen!5e0!3m2!1sen!2sde!4v1751615837328!5m2!1sen!2sde"
        class="z-10 flex-1 h-full w-full rounded-lg" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
    ON_COOKIE_CONSENT('full', () => {
        let frame = document.getElementById("loc_{{ .Page.File.UniqueID }}")
        let notice = document.getElementById("consent_{{ .Page.File.UniqueID }}")

        // If it's an iframe, set its src from data-target
        if (frame && frame.tagName === 'IFRAME' && frame.dataset.target) {
            frame.src = frame.dataset.target;
            frame.classList.remove('hidden')
            notice.remove()
        }
    })
</script>
