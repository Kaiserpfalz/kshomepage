{{$hasParams := .Params}}
{{$label := ""}}
{{if $hasParams}}
    {{if (isset .Params "label")}}
        {{ $label = .Params.label}}
    {{end}}
{{end}}

{{ $.Page.Store.SetInMap "elements" $label $label }}

<div class="shadow-lg mb-4 rounded-lg scroll-m-16 container" id="{{$label}}">
  {{ .Inner | .Page.RenderString }}
</div>
