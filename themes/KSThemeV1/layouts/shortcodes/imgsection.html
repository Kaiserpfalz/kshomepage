{{$hasParams := .Params}}
{{$flip := false}}
{{$src := ""}}

{{if $hasParams}}
    {{ $flip = isset .Params "flip"}}
    {{if (isset .Params "src")}}
        {{ $src = .Params.src}}
    {{end}}
{{end}}
<div class="lg:flex gap-4 lg:gap-8 mb-24 min-h-[400px] {{if not $flip}}flex-row-reverse{{end}}">
  <div class="flex-1 relative sm:min-h-[400px] min-h-[200px]">
    {{if $src}}
    <img src="{{relURL $src}}" alt="" class="w-full object-cover absolute inset-0 h-full rounded-lg shadow-lg">
    {{end}}
  </div>
  <div class="flex-1 shadow-lg rounded-lg bg-white">
    <div class="prose-sm xl:prose-lg p-8 lg:p-16 sm:prose-base">
      {{ .Inner | .Page.RenderString }}
    </div>
  </div>
</div>
