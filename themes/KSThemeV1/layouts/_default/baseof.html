<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}" class="scroll-smooth">

<head>
  {{ partial "head.html" . }}
</head>

<body class="flex flex-col min-h-screen">
  <div class="hidden -z-50 fixed inset-0 md:flex justify-center items-center p-24 w-screen h-screen">
    <img src="{{urls.AbsURL "images/bgw.jpeg"}}" class="opacity-4 w-full h-full object-center object-contain" alt="">
  </div>
  {{ block "header" . }}{{ end }}
  {{ partial "navbar.html" . }}
  <main class="mx-auto p-4 container">
    {{ block "main" . }}{{ end }}
  </main>
  {{block "footer" .}}
  <footer class="mt-auto p-4 w-full">
    {{ partial "footer.html" . }}
  </footer>
  {{end}}
</body>
</html>
