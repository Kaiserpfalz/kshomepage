<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}" class="scroll-smooth">

<head>
  {{ partial "head.html" . }}
</head>

<body class="min-h-screen flex flex-col">
  <div class="fixed md:flex items-center justify-center w-screen h-screen inset-0 -z-50 p-24 hidden">
    <img src="{{urls.AbsURL "images/bgw.jpeg"}}" class="opacity-[4%] w-full h-full object-contain object-center" alt="">
  </div>
  {{ block "header" . }}{{ end }}
  {{ partial "navbar.html" . }}
  <main class="p-4 container mx-auto">
    {{ block "main" . }}{{ end }}
  </main>
  {{block "footer" .}}
  <footer class="mt-auto w-full p-4">
    {{ partial "footer.html" . }}
  </footer>
  {{end}}
</body>
</html>
