{{ define "main" }}

{{$content := .Content}}
<div class="mt-16 flex gap-8">
    <aside class="fixed top-0 bottom-0 py-32 pb-46 hidden lg:block">
        <div class="relative flex flex-col gap-6 pt-2 h-full">
          {{ $labels := .Store.GetSortedMapValues "elements" }}
          {{range $labels}}
          <a href="#{{.}}" class="flex gap-2 items-center group cursor-pointer">
            <div class="h-4 w-4 border-[1px] bg-white border-zinc-400 rounded-sm"></div>
            <span class="font-semibold group-hover:text-lime-500 text-zinc-700">{{.}}</span>
          </a>
          {{end}}
      
          <div class="absolute inset-0 -z-10">
              <div class="ml-[7px] w-[1px] h-full bg-zinc-400"></div>
            <div class="absolute top-0 w-4 h-[1px] bg-zinc-400"></div>
            <div class="absolute bottom-0 w-4 h-[1px] bg-zinc-400"></div>
          </div>
        </div>
    </aside>
  <div class="flex-1 lg:ml-32 mx-4">
    {{$content}}
  </div>
</div>
{{ end }}
